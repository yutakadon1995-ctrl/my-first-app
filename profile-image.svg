<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" role="img" aria-labelledby="title desc">
  <title id="title">Cool neon profile image</title>
  <desc id="desc">A dark abstract portrait silhouette with neon purple and cyan lights.</desc>
  <defs>
    <radialGradient id="glowA" cx="28%" cy="18%" r="55%">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#171625" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#050507"/>
    </radialGradient>
    <radialGradient id="glowB" cx="78%" cy="28%" r="50%">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.78"/>
      <stop offset="0.58" stop-color="#101018" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#050507" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="figure" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2f2c45"/>
      <stop offset="0.5" stop-color="#11111a"/>
      <stop offset="1" stop-color="#040406"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="34" stdDeviation="32" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="900" height="1000" fill="#050507"/>
  <rect width="900" height="1000" fill="url(#glowA)"/>
  <rect width="900" height="1000" fill="url(#glowB)"/>
  <g opacity="0.55">
