    <path d="M-100 760 C150 652 320 761 511 655 C672 566 736 478 1000 518" fill="none" stroke="#7c5cff" stroke-width="5"/>
    <path d="M90 180 L810 180" stroke="#fff" stroke-opacity="0.08" stroke-width="2"/>
    <path d="M90 820 L810 820" stroke="#fff" stroke-opacity="0.08" stroke-width="2"/>
  </g>
  <g filter="url(#softShadow)">
    <circle cx="450" cy="365" r="154" fill="url(#figure)"/>
    <path d="M207 884 C232 682 314 565 450 565 C586 565 668 682 693 884 Z" fill="url(#figure)"/>
  </g>
  <circle cx="450" cy="365" r="170" fill="none" stroke="#00d4ff" stroke-opacity="0.42" stroke-width="5"/>
  <path d="M232 884 C258 705 331 603 450 603 C569 603 642 705 668 884" fill="none" stroke="#7c5cff" stroke-opacity="0.5" stroke-width="6"/>
  <g fill="#fff" opacity="0.88">
